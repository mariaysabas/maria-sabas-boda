<script src="https://upload-widget.cloudinary.com/latest/global/all.js"></script>
<script>
  // ---- Galería en directo con Cloudinary ----
  // Solo hay que rellenar estas dos líneas con los datos de vuestra cuenta de Cloudinary.
  // Ninguno de los dos es secreto: con ellos solo se puede SUBIR y VER, nunca borrar.
  const CLOUD_NAME = "vwo4jbsj";           // Dashboard de Cloudinary → "Cloud name"
  const UPLOAD_PRESET = "boda_invitados";  // nombre del upload preset sin firma (ver instrucciones)
  const TAG = "boda";                      // etiqueta que se añade a cada archivo subido
  const PAGE_SIZE = 20;                    // tarjetas que se muestran cada vez

  const photosGrid = document.getElementById('gallery-grid-photos');
  const videosGrid = document.getElementById('gallery-grid-videos');
  const loadMorePhotosBtn = document.getElementById('load-more-photos');
  const loadMoreVideosBtn = document.getElementById('load-more-videos');
  const refreshBtn = document.getElementById('gallery-refresh');
  const uploadBtn = document.getElementById('gallery-upload');
  const uploadStatus = document.getElementById('upload-status');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxVideo = document.getElementById('lightbox-video');
  const lightboxClose = document.getElementById('lightbox-close');

  const BASE = `https://res.cloudinary.com/${CLOUD_NAME}`;
  let allPhotos = [], allVideos = [];
  let photosShown = 0, videosShown = 0;

  // Cloudinary publica una lista de todos los archivos con una etiqueta concreta.
  // (Requiere activar "Resource list" en Settings → Security; ver instrucciones.)
  async function fetchList(kind){
    const res = await fetch(`${BASE}/${kind}/list/${TAG}.json?t=${Date.now()}`);
    if (res.status === 404) return [];        // todavía no hay ningún archivo de ese tipo
    if (!res.ok) throw new Error(`Cloudinary ${kind} list: ${res.status}`);
    const data = await res.json();
    return (data.resources || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  }

  async function loadGallery(){
    photosGrid.innerHTML = '<div class="gallery-status">Cargando fotos&hellip;</div>';
    videosGrid.innerHTML = '<div class="gallery-status">Cargando vídeos&hellip;</div>';
    loadMorePhotosBtn.style.display = 'none';
    loadMoreVideosBtn.style.display = 'none';

    if (CLOUD_NAME === "TU_CLOUD_NAME"){
      photosGrid.innerHTML = '<div class="gallery-status">Falta configurar Cloudinary en galeria.html (CLOUD_NAME).</div>';
      videosGrid.innerHTML = '';
      return;
    }
    try {
      [allPhotos, allVideos] = await Promise.all([fetchList('image'), fetchList('video')]);
      photosShown = 0; videosShown = 0;
      renderMorePhotos();
      renderMoreVideos();
    } catch (err){
      console.error(err);
      photosGrid.innerHTML = '<div class="gallery-status">No se han podido cargar los archivos ahora mismo. Inténtalo de nuevo en un rato.</div>';
      videosGrid.innerHTML = '';
    }
  }

  // Miniaturas y versiones grandes generadas por Cloudinary al vuelo:
  // recorte cuadrado inteligente, formato y calidad automáticos (también convierte HEIC de iPhone).
  const photoThumb = r => `${BASE}/image/upload/c_fill,g_auto,w_500,h_500,f_auto,q_auto/v${r.version}/${r.public_id}`;
  const photoLarge = r => `${BASE}/image/upload/c_limit,w_1800,h_1800,f_auto,q_auto/v${r.version}/${r.public_id}`;
  const videoThumb = r => `${BASE}/video/upload/so_1,c_fill,w_500,h_500,q_auto/v${r.version}/${r.public_id}.jpg`;
  const videoSrc   = r => `${BASE}/video/upload/q_auto/v${r.version}/${r.public_id}.mp4`;

  function renderMorePhotos(){
    if (photosShown === 0) photosGrid.innerHTML = '';
    if (allPhotos.length === 0){
      photosGrid.innerHTML = '<div class="gallery-status">Todavía no hay fotos. ¡Sé el primero en subir una!</div>';
      return;
    }
    allPhotos.slice(photosShown, photosShown + PAGE_SIZE).forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'gallery-photo';
      btn.setAttribute('aria-label', 'Ver foto ampliada');
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = photoThumb(r);
      img.alt = 'Foto de la boda';
      btn.appendChild(img);
      btn.addEventListener('click', () => openLightboxImage(photoLarge(r)));
      photosGrid.appendChild(btn);
    });
    photosShown = Math.min(photosShown + PAGE_SIZE, allPhotos.length);
    loadMorePhotosBtn.style.display = photosShown < allPhotos.length ? 'inline-block' : 'none';
  }

  function renderMoreVideos(){
    if (videosShown === 0) videosGrid.innerHTML = '';
    if (allVideos.length === 0){
      videosGrid.innerHTML = '<div class="gallery-status">Todavía no hay vídeos. ¡Sé el primero en subir uno!</div>';
      return;
    }
    allVideos.slice(videosShown, videosShown + PAGE_SIZE).forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'gallery-photo gallery-video-tile';
      btn.setAttribute('aria-label', 'Reproducir vídeo');
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = videoThumb(r);
      img.alt = 'Vídeo de la boda';
      const play = document.createElement('span');
      play.className = 'play-icon';
      play.innerHTML = '&#9658;';
      btn.appendChild(img);
      btn.appendChild(play);
      btn.addEventListener('click', () => openLightboxVideo(videoSrc(r)));
      videosGrid.appendChild(btn);
    });
    videosShown = Math.min(videosShown + PAGE_SIZE, allVideos.length);
    loadMoreVideosBtn.style.display = videosShown < allVideos.length ? 'inline-block' : 'none';
  }

  // ---- Subida desde la propia página ----
  // El "upload preset sin firma" solo permite AÑADIR archivos: no puede borrar ni
  // sobrescribir nada. Borrar exige la clave secreta de la cuenta, que nunca va en la web.
  let uploadWidget = null;
  let uploadedCount = 0;
  function getUploadWidget(){
    if (uploadWidget) return uploadWidget;
    uploadWidget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      tags: [TAG],                  // la galería muestra todo lo que lleve esta etiqueta
      sources: ['local', 'camera'],
      multiple: true,
      maxFiles: 100,
      clientAllowedFormats: ['image', 'video'],
      maxImageFileSize: 20000000,   // 20 MB por foto
      maxVideoFileSize: 100000000,  // 100 MB por vídeo (límite del plan gratuito)
      language: 'es',
      showPoweredBy: false
    }, (error, result) => {
      if (error){
        console.error(error);
        uploadStatus.textContent = 'Algo ha fallado al subir algún archivo. Prueba otra vez.';
        return;
      }
      if (result.event === 'success') uploadedCount++;
      if (result.event === 'queues-end' || result.event === 'close'){
        if (uploadedCount > 0){
          uploadStatus.textContent = `¡Gracias! Se han subido ${uploadedCount} archivo(s). Pueden tardar un minuto en aparecer.`;
          uploadedCount = 0;
          setTimeout(loadGallery, 4000);
        }
      }
    });
    return uploadWidget;
  }

  uploadBtn.addEventListener('click', () => {
    if (CLOUD_NAME === "TU_CLOUD_NAME"){
      uploadStatus.textContent = 'Falta configurar Cloudinary en galeria.html.';
      return;
    }
    uploadStatus.textContent = '';
    getUploadWidget().open();
  });

  // ---- Visor ampliado ----
  function openLightboxImage(src){
    lightboxVideo.pause();
    lightboxVideo.removeAttribute('src');
    lightboxVideo.style.display = 'none';
    lightboxImg.style.display = 'block';
    lightboxImg.src = src;
    lightbox.classList.add('open');
  }
  function openLightboxVideo(src){
    lightboxImg.style.display = 'none';
    lightboxImg.src = '';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = src;
    lightbox.classList.add('open');
    lightboxVideo.play().catch(() => {});
  }
  function closeLightbox(){
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    lightboxVideo.pause();
    lightboxVideo.removeAttribute('src');
    lightboxVideo.load();
  }
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

  refreshBtn.addEventListener('click', loadGallery);
  loadMorePhotosBtn.addEventListener('click', renderMorePhotos);
  loadMoreVideosBtn.addEventListener('click', renderMoreVideos);
  loadGallery();
</script>

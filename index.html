<main class="portada">
  <h1 style="margin:0;"><img src="assets/titulo.webp" alt="María &amp; Sabas" class="portada__titulo" width="1057" height="562"></h1>
  <div>
    <p class="portada__casamos">¡NOS CASAMOS!</p>
    <p class="portada__fecha">24 de abril de 2027</p>
  </div>
  <div class="cuenta" role="timer" aria-label="Cuenta atrás hasta la boda">
    <div><strong id="cd-days">0</strong><span>DÍAS</span></div>
    <div><strong id="cd-hours">00</strong><span>HORAS</span></div>
    <div><strong id="cd-mins">00</strong><span><span class="largo">MINUTOS</span><span class="corto">MIN</span></span></div>
    <div><strong id="cd-secs">00</strong><span><span class="largo">SEGUNDOS</span><span class="corto">SEG</span></span></div>
  </div>
  <a class="btn" href="confirmacion.html">Confirmar asistencia</a>
</main>

<script>
  // Cuenta atrás hasta el 24 de abril de 2027 a las 13:00, hora de Madrid (en abril, UTC+2).
  const weddingDate = new Date("2027-04-24T13:00:00+02:00");
  const two = n => String(n).padStart(2, "0");
  function updateCountdown(){
    const diff = Math.max(0, weddingDate - new Date());
    document.getElementById("cd-days").textContent = Math.floor(diff / 86400000);
    document.getElementById("cd-hours").textContent = two(Math.floor(diff / 3600000) % 24);
    document.getElementById("cd-mins").textContent = two(Math.floor(diff / 60000) % 60);
    document.getElementById("cd-secs").textContent = two(Math.floor(diff / 1000) % 60);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

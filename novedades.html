<script type="module">
import { onSession, gateMessage, db, collection, getDocs, query, orderBy, escapeHtml, formatDate } from "./auth.js";

const root = document.getElementById("news-root");

onSession(async s => {
  const gate = gateMessage(s, "ver las novedades de la boda");
  if (gate) { root.innerHTML = `<div class="panel">${gate}</div>`; return; }
  try {
    const snap = await getDocs(query(collection(db, "news"), orderBy("createdAt", "desc")));
    const items = snap.docs.map(d => d.data());
    root.innerHTML = `<div class="panel">${items.length
      ? items.map(n => `<article class="news-item"><div class="date">${formatDate(n.createdAt)}</div><h3>${escapeHtml(n.title)}</h3><div class="body">${escapeHtml(n.body)}</div></article>`).join("")
      : "<p>Todavía no hay novedades. Os avisaremos por aquí de cualquier cambio de horarios, transporte o detalles de última hora.</p>"}</div>`;
  } catch (e) {
    console.error(e);
    root.innerHTML = `<div class="panel"><p class="form-msg error">No se pudieron cargar las novedades. Recarga la página en un momento.</p></div>`;
  }
});
</script>

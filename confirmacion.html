</head>

<!-- Menú móvil -->
<header class="nav-narrow">
  <button class="nav-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="navlinks">
    <svg class="icono-abrir" aria-hidden="true" width="26" height="22" viewBox="0 0 26 22" fill="none"><path d="M2 4 C 8 2, 16 5, 24 3" stroke="#6B6B21" stroke-width="3" stroke-linecap="round"/><path d="M2 11 C 9 9, 16 12, 24 10" stroke="#6B6B21" stroke-width="3" stroke-linecap="round"/><path d="M2 18 C 8 16, 17 19, 24 17" stroke="#6B6B21" stroke-width="3" stroke-linecap="round"/></svg>
    <svg class="icono-cerrar" aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 3 C 8 8, 14 14, 19 19" stroke="#6B6B21" stroke-width="3" stroke-linecap="round"/><path d="M19 3 C 14 8, 8 14, 3 19" stroke="#6B6B21" stroke-width="3" stroke-linecap="round"/></svg>

</header>

<main class="pagina pagina--formulario">
  <header class="cabecera">
    <h1 class="titulo-pagina titulo-pagina--largo">CONFIRMACIÓN DE ASISTENCIA</h1>
    <p class="cabecera__nota">Por favor, confirma antes del [fecha límite]</p>
  </header>
  <div class="pila" id="rsvp-root"><div class="tarjeta"><p>Cargando&hellip;</p></div></div>
</main>

<script type="module">
import { onSession, gateMessage, loadRsvp, saveRsvp, anyErrorText, escapeHtml, formatDate } from "./auth.js";
import { QUESTIONS, MENUS, MAX_ATTENDEES } from "./rsvp-questions.js";


const root = document.getElementById("rsvp-root");

function questionHtml(q, value) {
  const name = "q-" + q.id;
  const opt = q.required ? "" : ' <span class="opcional">(opcional)</span>';
  const help = q.help ? `<p class="ayuda">${escapeHtml(q.help)}</p>` : "";
  if (q.type === "radio" || q.type === "checkbox") {
    const vals = Array.isArray(value) ? value : [value];
    const ops = q.options.map(o =>
      `<label class="op"><input type="${q.type}" name="${name}" value="${escapeHtml(o)}" ${vals.includes(o) ? "checked" : ""}> ${escapeHtml(o)}</label>`).join("");
    return `<div class="sep" data-q="${q.id}"><fieldset class="bloque"><legend>${escapeHtml(q.label)}${opt}</legend>${help}${ops}</fieldset></div>`;
  }
  const input = q.type === "textarea"
    ? `<textarea class="campo" id="${name}" rows="4" maxlength="1000">${escapeHtml(value || "")}</textarea>`
    : `<input class="campo" id="${name}" maxlength="200" value="${escapeHtml(value || "")}">`;
  return `<div class="sep" data-q="${q.id}"><label class="etq" for="${name}">${escapeHtml(q.label)}${opt}</label>${help}${input}</div>`;
}

function attendeeHtml(a, i) {
  return `
  <div class="persona attendee">
    <div class="persona__cabecera"><span class="persona__titulo">PERSONA ${i + 1}</span>${i > 0 ? '<button type="button" class="btn-quitar remove">Quitar</button>' : ""}</div>
    <label><span class="etq">Nombre y apellidos</span><input class="campo a-name" maxlength="80" value="${escapeHtml(a.name || "")}"></label>
    <label><span class="etq">Menú</span><select class="campo a-menu">${MENUS.map(m => `<option ${a.menu === m ? "selected" : ""}>${m}</option>`).join("")}</select></label>
    <label><span class="etq">Alergias o intolerancias <span class="opcional">(si no hay, déjalo vacío)</span></span><input class="campo a-allergies" maxlength="200" value="${escapeHtml(a.allergies || "")}" placeholder="Ej.: celiaquía, frutos secos, vegetariano…"></label>
  </div>`;
}

function readAttendees() {
  return [...root.querySelectorAll(".attendee")].map(el => ({
    name: el.querySelector(".a-name").value.trim(),
    menu: el.querySelector(".a-menu").value,
    allergies: el.querySelector(".a-allergies").value.trim()
  }));
}

function readAnswers() {
  const out = {};
  QUESTIONS.forEach(q => {
    const name = "q-" + q.id;
    if (q.type === "radio") out[q.id] = root.querySelector(`input[name="${name}"]:checked`)?.value || "";
    else if (q.type === "checkbox") out[q.id] = [...root.querySelectorAll(`input[name="${name}"]:checked`)].map(i => i.value);
    else out[q.id] = document.getElementById(name).value.trim();
  });
  return out;
}

async function renderForm(s) {
  root.innerHTML = `<div class="tarjeta"><p>Cargando&hellip;</p></div>`;
  let saved = null;
  try { saved = await loadRsvp(); } catch (e) { console.error(e); }

  const attending = saved?.attending || "";
  const attendees = saved?.attendees?.length ? saved.attendees : [{ name: s.profile.realName, menu: "Adulto", allergies: "" }];
  const answers = saved?.answers || {};

  root.innerHTML = `
  <form class="tarjeta formulario" id="rsvp-form" novalidate>
    ${saved ? `<p class="aviso">Ya nos enviaste tu respuesta${saved.updatedAt ? " el " + formatDate(saved.updatedAt) : ""}. Puedes cambiarla cuando quieras y volver a guardar.</p>` : ""}
    <fieldset class="bloque">
      <legend>¿Vendréis?</legend>
      <label class="op"><input type="radio" name="attending" value="si" ${attending === "si" ? "checked" : ""}> Sí, allí estaremos</label>
      <label class="op"><input type="radio" name="attending" value="no" ${attending === "no" ? "checked" : ""}> No podremos ir</label>
    </fieldset>

    <div id="yes-part" class="formulario__parte" ${attending === "si" ? "" : "hidden"}>
      <div class="sep">
        <h2>¿Quiénes venís?</h2>
        <p class="ayuda">Una ficha por persona, incluida tú o tú mismo. Así sabremos los menús y las alergias de cada uno.</p>
        <div id="attendees" class="personas">${attendees.map(attendeeHtml).join("")}</div>
        <p style="margin:18px 0 0;"><button type="button" class="btn btn--ghost" id="add">+ Añadir persona</button></p>
      </div>
      ${QUESTIONS.filter(q => q.id !== "comentarios").map(q => questionHtml(q, answers[q.id])).join("")}
    </div>
    ${QUESTIONS.filter(q => q.id === "comentarios").map(q => questionHtml(q, answers[q.id])).join("")}

    <div class="acciones">
      <button class="btn" type="submit" id="save" style="font-size:34px;">${saved ? "Guardar cambios" : "Enviar confirmación"}</button>
      <p class="form-msg" id="msg" role="status"></p>
    </div>
  </form>`;

  const yesPart = document.getElementById("yes-part");
  const list = document.getElementById("attendees");
  const msg = document.getElementById("msg");
  const setMsg = (t, k) => { msg.textContent = t; msg.className = "form-msg" + (k ? " " + k : ""); };

  const renumber = () => {
    [...list.children].forEach((el, i) => { el.querySelector(".persona__titulo").textContent = "PERSONA " + (i + 1); });
    document.getElementById("add").hidden = list.children.length >= MAX_ATTENDEES;
  };
  list.addEventListener("click", e => {
    if (e.target.classList.contains("remove")) { e.target.closest(".attendee").remove(); renumber(); }
  });
  document.getElementById("add").onclick = () => {
    list.insertAdjacentHTML("beforeend", attendeeHtml({ menu: "Adulto" }, list.children.length));
    renumber();
    list.lastElementChild.querySelector(".a-name").focus();
  };
  renumber();

  root.querySelectorAll('input[name="attending"]').forEach(r => r.addEventListener("change", () => {
    yesPart.hidden = root.querySelector('input[name="attending"]:checked')?.value !== "si";
  }));

  document.getElementById("rsvp-form").onsubmit = async e => {
    e.preventDefault();
    const att = root.querySelector('input[name="attending"]:checked')?.value;
    if (!att) return setMsg("Dinos si vendréis o no.", "error");
    const allAnswers = readAnswers();
    let people = [], answersToSave = {};
    if (att === "si") {
      people = readAttendees();
      if (people.some(p => !p.name)) return setMsg("Falta el nombre de alguna persona.", "error");
      const missing = QUESTIONS.find(q => q.required && (Array.isArray(allAnswers[q.id]) ? !allAnswers[q.id].length : !allAnswers[q.id]));
      if (missing) return setMsg(`Falta responder: «${missing.label}».`, "error");
      answersToSave = allAnswers;
    } else {
      // Si no venís, solo guardamos los comentarios.
      QUESTIONS.filter(q => q.id === "comentarios").forEach(q => { answersToSave[q.id] = allAnswers[q.id]; });
    }
    const btn = document.getElementById("save");
    btn.disabled = true;
    try {
      await saveRsvp({ attending: att, attendees: people, answers: answersToSave });
      setMsg(att === "si" ? "¡Guardado! Gracias por confirmar. Puedes volver aquí y cambiarlo cuando quieras." : "Guardado. ¡Os echaremos de menos!", "ok");
      btn.textContent = "Guardar cambios";
    } catch (err) {
      console.error(err);
      setMsg(anyErrorText(err), "error");
    } finally { btn.disabled = false; }
  };
}

onSession(s => {
  const gate = gateMessage(s, "confirmar tu asistencia");
  if (gate) root.innerHTML = `<div class="tarjeta">${gate}</div>`;
  else renderForm(s);
});
</script>

<script src="menu.js"></script>
<script type="module" src="auth.js"></script>
</body>
</html>
